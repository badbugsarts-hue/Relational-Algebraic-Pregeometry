name: RAP scoped Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python RAP_Master_Verification.py --output results/master-verification.json
      - run: python rap_proof_engine.py --n 6 --exhaustive --dps 100 --output results/core-engine-100.json
      - run: python scripts/run_tests.py
      - run: python scripts/update_status.py
      # No automatic publication, evidence upgrade, Lean or manuscript-build claim.

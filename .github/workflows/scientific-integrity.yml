name: Scientific Integrity Gates

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  scientific-integrity:
    name: Scientific Integrity (Fail Closed)
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out complete PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run fail-closed range tests
        run: python -m pytest verification/tests/test_integrity_gates.py -v

      - name: Check evidence tags on exact PR range
        run: python verification/scripts/check_evidence_tags.py

      - name: Check target leakage on exact PR range
        run: python verification/scripts/check_no_gamma_targeting.py

      - name: Check merge requirements on exact PR range
        run: python verification/scripts/check_merge_requirements.py

      - name: Check protected paths on exact PR range
        run: python verification/scripts/check_protected_paths.py
